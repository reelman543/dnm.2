name: Günlük ve Manuel M3U8 Güncelleme

on:
  schedule:
    - cron: "0 * * * *"  # Her saat başı çalışır
  workflow_dispatch:      # Manuel olarak çalıştırılabilir

jobs:
  update-m3u8:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu klonla
        uses: actions/checkout@v4

      - name: Python kurulum
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: M3U8 dosyasını güncelle
        run: python dlhd_to_m3u8.py

      - name: Commit ve push değişiklikler
        run: |
          if [ -f dlhd.m3u8 ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add dlhd.m3u8
            git diff-index --quiet HEAD || git commit -m "🔄 Otomatik veya Manuel güncelleme: $(date '+%Y-%m-%d %H:%M:%S')"
            git push origin main
          else
            echo "dlhd.m3u8 bulunamadı, commit yapılmadı."
          fi
