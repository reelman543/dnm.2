name: Güncel Porn+18 M3U8

# Her 2 saatte bir çalışacak
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:  # Manuel tetikleme için

jobs:
  update_m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v3

      - name: Python kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Gereksinimleri kur
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: PRN Scripti çalıştır
        run: python PRN.py

      - name: Güncellenen dosyaları commit ve push et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aktif_porn18_kanallar.m3u calismayan_porn18_kanallar.m3u
          git commit -m "Otomatik güncelleme: $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes"
          git push
