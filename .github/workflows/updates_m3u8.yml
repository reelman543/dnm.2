name: Update M3U8 Files

# Her saat başı ve manuel tetikleme
on:
  schedule:
    - cron: "0 * * * *"  # UTC ile her saat başı
  workflow_dispatch:

permissions:
  contents: write  # Commit/push izni

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repo'yu checkout et
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Gerekli paketleri yükle
        run: |
          pip install -r requirements.txt

      - name: M3U8 dosyalarını oluştur
        run: |
          python download_m3u8.py

      - name: Değişiklikleri commit ve push et
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add *.m3u8
          git commit -m "M3U8 dosyaları güncellendi: $(date +'%Y-%m-%d %H:%M:%S')" || echo "Değişiklik yok"
          git push
