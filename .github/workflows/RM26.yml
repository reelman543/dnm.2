name: M3U Listesi Güncelle

on:
  schedule:
    - cron: "0 */3 * * *"   # 3 saatte bir çalışır
  workflow_dispatch:        # Manuel çalıştırma için

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v3

      - name: Python kur
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Bağımlılıkları yükle
        run: pip install requests

      - name: Scripti çalıştır
        run: python RM26.py   # senin dosya adın, örn: merge.py

      - name: Çıktıyı commit et
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add kanallar.m3u
          git commit -m "Otomatik M3U güncelleme" || echo "Değişiklik yok"
          git push
