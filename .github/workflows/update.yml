name: 🔄 Update FashionTV M3U

on:
  schedule:
    - cron: "*/5 * * * *"   # ⏰ her 5 dakikada bir çalışır
  workflow_dispatch:        # manuel tetikleme

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Repo'yu çek
        uses: actions/checkout@v3

      - name: 🐍 Python kur
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: 📦 requests kuralım
        run: pip install requests

      - name: ▶️ Tokenli M3U güncelle
        run: python update_token.py

      - name: 📤 Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fashiontv.m3u
          git commit -m "🔄 Auto-update fashiontv.m3u [skip ci]" || echo "No changes"
          git push
