name: 🔄 Update FashionTV M3U

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: 📦 Install requests
        run: pip install requests

      - name: ▶️ Run updater
        run: python update_token.py

      - name: 📤 Commit & Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fashiontv.m3u
          if git diff --cached --quiet; then
            echo "⚠️ Değişiklik yok, commit atılmadı."
            exit 0
          fi
          git commit -m "🔄 Auto-update fashiontv.m3u [skip ci]"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} HEAD:${{ github.ref }}
