name: Update M3U8 Files

on:
  schedule:
    - cron: "0 * * * *"  # Her saat başı (UTC)
  workflow_dispatch:    # Manuel tetikleme

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run downloader (SSL bypass)
        run: |
          python download_m3u8.py

      - name: Commit and push m3u8 files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dlhd_*.m3u8 || true
          git commit -m "M3U8 dosyaları güncellendi: $(date -u +"%Y-%m-%d %H:%M:%SZ")" || echo "No changes to commit"
          git push
